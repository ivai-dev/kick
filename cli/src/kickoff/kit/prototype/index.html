/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-14);
  font-weight: var(--fw-regular);
  line-height: var(--lh);
  -webkit-font-smoothing: antialiased;
}
#app { height: 100%; }
/* The page has no doctype (Artifact page contract), so it renders in quirks mode, where tables do not inherit text styles. */
table{color:inherit}
table { font-size: inherit; font-weight: inherit; line-height: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary-ink); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--primary-hover); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--primary-soft); }
b, strong { font-weight: var(--fw-medium); }
.ic { flex-shrink: 0; display: block; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.subtle { color: var(--ink-3); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
.row { display: flex; align-items: center; gap: var(--sp-2); }
.col { display: flex; flex-direction: column; }
.grow { flex: 1 1 auto; min-width: 0; }
.spacer { flex: 1; }
.clamp1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Type scale ---------- */
.t-cap { font-size: var(--fs-12); line-height: var(--lh); font-weight: var(--fw-medium); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.t-meta { font-size: var(--fs-13); line-height: var(--lh); font-weight: var(--fw-regular); color: var(--ink-3); }
.t-ui { font-size: var(--fs-14); line-height: var(--lh); font-weight: var(--fw-medium); }
.t-strong { font-size: var(--fs-14); line-height: var(--lh); font-weight: var(--fw-medium); color: var(--ink); }
.t-body { font-size: var(--fs-16); line-height: var(--lh); font-weight: var(--fw-regular); color: var(--ink-2); max-width: 68ch; }
.t-h3 { font-size: var(--fs-16); line-height: var(--lh); font-weight: var(--fw-bold); }
.t-h2 { font-size: var(--fs-18); line-height: var(--lh); font-weight: var(--fw-bold); letter-spacing: -.01em; }
.t-h1 { font-size: var(--fs-22); line-height: var(--lh); font-weight: var(--fw-bold); letter-spacing: -.01em; }
.t-kpi { font-size: var(--fs-28); line-height: var(--lh); font-weight: var(--fw-bold); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }

/* ---------- Prototype bar (not part of the product) ---------- */
.proto { height: var(--proto-h); display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-4); background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 60; }
.proto-tag { display: inline-flex; align-items: center; gap: var(--sp-2); white-space: nowrap; }
.proto-tag b { display: inline-flex; padding: 2px var(--sp-2); border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-size: var(--fs-12); font-weight: var(--fw-medium); letter-spacing: .06em; text-transform: uppercase; }
.proto-role { display: inline-flex; align-items: center; gap: var(--sp-2); }
.proto-role .pb-lbl { white-space: nowrap; }
.proto-role .select { max-width: 200px; }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-3); border-radius: 10px; flex-shrink: 0; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2); font-size: var(--fs-13); font-weight: var(--fw-medium); white-space: nowrap; transition: background-color var(--d-fast), color var(--d-fast); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

.stage { height: calc(100% - var(--proto-h)); position: relative; overflow: hidden; }

/* ---------- Buttons ---------- */
.btn {
  --b-bg: var(--surface); --b-fg: var(--ink); --b-bd: var(--line-strong); --b-hover: var(--surface-3);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  height: 40px; padding: 0 var(--sp-4); border-radius: var(--r-md);
  border: 1px solid var(--b-bd); background: var(--b-bg); color: var(--b-fg);
  font-size: var(--fs-14); font-weight: var(--fw-medium); line-height: 1; white-space: nowrap;
  transition: background-color var(--d-fast) var(--ease-out), border-color var(--d-fast), color var(--d-fast), transform var(--d-fast);
  user-select: none; text-decoration: none; flex-shrink: 0;
}
.btn:hover { background: var(--b-hover); color: var(--b-fg); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; transform: none; }
.btn.primary { --b-bg: var(--primary); --b-fg: var(--on-primary); --b-bd: var(--primary); --b-hover: var(--primary-hover); }
.btn.primary:active { --b-bg: var(--primary-press); }
.btn.danger { --b-bg: var(--danger); --b-fg: var(--on-danger); --b-bd: var(--danger); --b-hover: var(--danger); }
.btn.ghost { --b-bg: transparent; --b-bd: transparent; --b-fg: var(--ink-2); --b-hover: var(--surface-3); }
.btn.ghost:hover { color: var(--ink); }
.btn.soft { --b-bg: var(--primary-soft); --b-bd: transparent; --b-fg: var(--primary-ink); --b-hover: var(--primary-soft); }
.btn.sm { height: 32px; padding: 0 var(--sp-3); font-size: var(--fs-13); border-radius: 7px; gap: 6px; }
.btn.lg { height: 48px; padding: 0 var(--sp-6); font-size: var(--fs-16); border-radius: 10px; }
.btn.icon { width: 40px; padding: 0; }
.btn.icon.sm { width: 32px; }
.btn.block { width: 100%; }

/* ---------- Inputs ---------- */
.field { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
.field > label { font-size: var(--fs-14); font-weight: var(--fw-medium); color: var(--ink); }
.field .hint { font-size: var(--fs-13); color: var(--ink-3); }
.field .err { font-size: var(--fs-13); color: var(--danger-ink); display: flex; gap: 6px; align-items: center; }
.req { color: var(--danger-ink); margin-left: 2px; }
.input, .select, .textarea {
  width: 100%; height: 40px; padding: 0 var(--sp-3);
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  background: var(--surface); color: var(--ink); font-size: var(--fs-14);
  transition: border-color var(--d-fast), box-shadow var(--d-fast);
}
.textarea { height: auto; min-height: 88px; padding: 10px var(--sp-3); resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--ink-3); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--ink-3); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.select { appearance: none; padding-right: 36px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 18px) 18px, calc(100% - 13px) 18px; background-size: 5px 5px; background-repeat: no-repeat; }
.select.sm { height: 32px; font-size: var(--fs-13); background-position: calc(100% - 18px) 14px, calc(100% - 13px) 14px; }
.check { display: inline-flex; align-items: center; gap: var(--sp-3); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); margin: 0; }

/* ---------- Chips, badges ---------- */
.pill {
  --p-bg: var(--surface-3); --p-fg: var(--ink-2);
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: 999px;
  background: var(--p-bg); color: var(--p-fg); font-size: var(--fs-13); font-weight: var(--fw-medium); white-space: nowrap; line-height: 1;
}
.pill.ok { --p-bg: var(--ok-soft); --p-fg: var(--ok-ink); }
.pill.warn { --p-bg: var(--warn-soft); --p-fg: var(--warn-ink); }
.pill.danger { --p-bg: var(--danger-soft); --p-fg: var(--danger-ink); }
.pill.info { --p-bg: var(--primary-soft); --p-fg: var(--primary-ink); }
.pill.accent { --p-bg: var(--accent-soft); --p-fg: var(--accent-ink); }
.pill.line { --p-bg: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--primary-soft); color: var(--primary-ink); flex-shrink: 0; }
.mark { width: 34px; height: 34px; border-radius: 10px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex-shrink: 0; }
.mark.xs { width: 20px; height: 20px; border-radius: 6px; }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.card-h { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4) var(--sp-6); border-bottom: 1px solid var(--line); min-height: 60px; flex-wrap: wrap; }
.card-h .ch-t { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.card-b { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-4); }
.card-flush { display: flex; flex-direction: column; }
.empty { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); padding: var(--sp-12) var(--sp-6); text-align: center; color: var(--ink-2); }
.empty .ic-wrap { width: 48px; height: 48px; border-radius: 14px; background: var(--surface-3); display: grid; place-items: center; color: var(--ink-3); }
.empty-txt { max-width: 52ch; }
.banner { display: flex; align-items: flex-start; gap: var(--sp-3); padding: 14px var(--sp-4); border-radius: var(--r-lg); background: var(--primary-soft); color: var(--primary-ink); }
.banner.warn { background: var(--warn-soft); color: var(--warn-ink); }
.banner.ok { background: var(--ok-soft); color: var(--ok-ink); }
.banner .ic { margin-top: 3px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: var(--sp-6); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: var(--fs-12); font-weight: var(--fw-medium); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: var(--sp-3) var(--sp-4); background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: var(--sp-4); border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl.dense td { padding: var(--sp-3) var(--sp-4); }
.tbl th:first-child, .tbl td:first-child { padding-left: var(--sp-6); }
.tbl th:last-child, .tbl td:last-child { padding-right: var(--sp-6); }
.tbl th.n, .tbl td.n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr.click { cursor: pointer; transition: background-color var(--d-fast); }
.tbl tbody tr.click:hover { background: var(--surface-2); }
.tbl .tbl-empty { text-align: center; color: var(--ink-3); padding: var(--sp-8) var(--sp-6); }

/* ---------- Key figures ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--sp-4); }
.kpi { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-5) var(--sp-6); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); min-width: 0; }
.kpi-l { display: flex; align-items: center; gap: 6px; }
.kpi-v { display: flex; align-items: baseline; gap: var(--sp-2); min-width: 0; }
.kpi-u { font-size: var(--fs-13); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.kpi-f { display: flex; align-items: center; gap: var(--sp-2); min-height: 22px; min-width: 0; }
.kpi-d { display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 7px 0 5px; border-radius: 999px; font-size: var(--fs-12); font-weight: var(--fw-medium); white-space: nowrap; background: var(--surface-3); color: var(--ink-2); }
.kpi-d.good { background: var(--ok-soft); color: var(--ok-ink); }
.kpi-d.bad { background: var(--warn-soft); color: var(--warn-ink); }

/* ---------- Desktop shell ---------- */
.shell { display: flex; height: 100%; }
.side { width: var(--sidebar); flex-shrink: 0; height: 100%; display: flex; flex-direction: column; gap: var(--sp-1); padding: var(--sp-4) var(--sp-3) var(--sp-3); background: var(--surface); border-right: 1px solid var(--line); transition: width var(--d-slow) var(--ease-out); overflow: hidden; }
.brand { display: flex; align-items: center; gap: 10px; padding: var(--sp-1) var(--sp-2) var(--sp-3); min-height: 48px; }
.brand-name { font-size: var(--fs-16); font-weight: var(--fw-bold); }
.nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; overflow-x: hidden; min-height: 0; }
.nav-sec { padding: var(--sp-4) var(--sp-3) var(--sp-2); }
.nav a { position: relative; display: flex; align-items: center; gap: var(--sp-3); flex-shrink: 0; height: 40px; padding: 0 var(--sp-3); border-radius: var(--r-md); color: var(--ink-2); text-decoration: none; white-space: nowrap; transition: background-color var(--d-fast), color var(--d-fast); }
.nav a .lbl { overflow: hidden; text-overflow: ellipsis; }
.nav a:hover { background: var(--surface-3); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--primary-soft); color: var(--primary-ink); font-weight: var(--fw-medium); }
.nav a .nav-rel { margin-left: auto; }
.nav a.rel-dim-nav { opacity: .45; cursor: not-allowed; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--sp-2); }
.me { display: flex; align-items: center; gap: 10px; padding: var(--sp-2); border: 0; border-radius: var(--r-md); background: none; text-align: left; white-space: nowrap; }
.me:hover { background: var(--surface-3); }
@media (min-width: 761px) {
  .shell.collapsed .side { width: var(--rail); }
  .shell.collapsed .side .hide-rail { display: none; }

/* ---------- Phone: frame, app bar, tab bar ---------- */

.ch-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-2); color: var(--ink-3); font-size: var(--fs-13); border: 1px dashed var(--line-strong); border-radius: var(--r-md); background: var(--surface-2); }
.ch-empty.h-sm { height: 120px; }

.ch-donut { display: flex; align-items: center; gap: var(--sp-6); flex-wrap: wrap; }
.ch-donut-plot { position: relative; flex-shrink: 0; }
.ch-dl { list-style: none; display: flex; flex-direction: column; gap: 2px; flex: 1 1 160px; min-width: 0; }
.ch-dl li { display: flex; align-items: center; gap: var(--sp-2); padding: 6px var(--sp-2); border-radius: 6px; font-size: var(--fs-13); }

/* ---------- Motion ---------- */

}
