[project]
name = "kick-cli"
version = "0.9.0"
description = "CLI for the kick Claude Code plugin"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.20"]

[project.scripts]
kick = "kick.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kick"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ecc: checks the ECC plugin installed on this machine (skipped without it)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long literals in generators and tests; the formatter owns line length
