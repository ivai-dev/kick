risks:
- id: R00
  title: Đội 3 người không sẵn sàng từ 28/09/2026 hoặc có người vào trễ, làm lỡ mốc MVP trước 12/2026
  phase: GĐ1–GĐ3
  p: 2
  i: 3
  mitigation: Xác nhận nhân sự ngay; nếu trễ, cắt phạm vi theo thứ tự đã thống nhất; đánh giá lại tại cổng G1
  trigger: Chưa đủ 3 người vào ngày 05/10/2026
  status: open
  i18n:
    en:
      title: The three-person team is not ready from 28/09/2026 or someone joins late, putting the MVP milestone before 12/2026
        at risk
      mitigation: Confirm staffing now; if late, cut scope in the agreed order; reassess at gate G1
      trigger: Fewer than three people on board on 05/10/2026
- id: R01
  title: Độ chính xác tiếng Việt với micro laptop (khoảng cách, giọng vùng miền, nói chồng) chưa đủ để viết biên bản
  phase: GĐ1–GĐ4
  p: 2
  i: 3
  mitigation: Chọn mô hình trên dữ liệu thật ngay GĐ1; nhận dạng 2 lượt; ưu tiên từ khóa; hướng dẫn đặt laptop; thống nhất
    chỉ tiêu tại G1
  trigger: Tỉ lệ lỗi âm tiết ở 3–5 m vượt xa mục tiêu
  status: open
  i18n:
    en:
      title: Vietnamese accuracy with a laptop microphone (distance, regional accents, overlapping speech) is not good enough
        to write minutes
      mitigation: Select the model on real data in phase 1; two-pass recognition; prioritise keywords; guidance on laptop
        placement; agree the target at G1
      trigger: Syllable error rate at 3–5 m is far above target
- id: R02
  title: Ghi âm trên trình duyệt bị gián đoạn khi người dùng đóng tab, máy ngủ hoặc rút sạc (MVP web)
  phase: GĐ2–GĐ4
  p: 2
  i: 3
  mitigation: Wake Lock, lưu tạm OPFS, tự khôi phục và tải lên lại; cảnh báo rõ trên màn hình; hướng dẫn 1 trang; ứng dụng
    desktop/mobile ở GĐ5
  trigger: Gián đoạn ghi âm trong kiểm thử hoặc thí điểm
  status: open
  i18n:
    en:
      title: Browser recording is interrupted when the user closes the tab, the machine sleeps or the charger is unplugged
        (web MVP)
      mitigation: Wake Lock, temporary OPFS storage, automatic recovery and re-upload; clear on-screen warning; one-page guide;
        desktop and mobile apps in phase 5
      trigger: A recording interruption during testing or the pilot
- id: R03
  title: Độ trễ cao khi nhiều cuộc họp chạy trên một GPU
  phase: GĐ1–GĐ4
  p: 2
  i: 3
  mitigation: Đo số luồng/GPU khi chọn mô hình; ưu tiên ASR hơn LLM; hàng đợi sinh biên bản; tính cấu hình từ Q1/Q2
  trigger: Độ trễ p95 vượt mục tiêu ở mức đồng thời thiết kế
  status: open
  i18n:
    en:
      title: High latency when several meetings run on one GPU
      mitigation: Measure streams per GPU when selecting the model; prioritise ASR over LLM; queue minutes generation; size
        the configuration from Q1/Q2
      trigger: p95 latency exceeds the target at the designed concurrency
- id: R04
  title: Trưởng dự án vừa quản lý vừa đảm nhận kỹ thuật lõi (backend, ASR/LLM)
  phase: Tất cả
  p: 2
  i: 2
  mitigation: Dành 20% thời gian cho quản lý; tài liệu kiến trúc và kiểm thử tự động; lập trình viên hỗ trợ phần triển khai
  trigger: Hạng mục của trưởng dự án trễ quá 3 ngày
  status: open
  i18n:
    en:
      title: The project lead both manages and does core technical work (backend, ASR/LLM)
      mitigation: Reserve 20% of time for management; architecture documents and automated tests; the developer supports deployment
        work
      trigger: A project lead item is more than 3 days late
- id: R05
  title: Phạm vi phình to từ phản hồi mockup và demo
  phase: GĐ1–GĐ7
  p: 2
  i: 2
  mitigation: Bản đồ tính năng có ranh giới MVP; yêu cầu mới chuyển sang giai đoạn sau trừ khi bỏ bớt hạng mục khác
  trigger: Yêu cầu P0/P1 mới sau G1
  status: open
  i18n:
    en:
      title: Scope grows from mockup and demo feedback
      mitigation: The feature map has an MVP boundary; new requests move to a later phase unless another item is dropped
      trigger: A new P0/P1 request after G1
- id: R06
  title: Máy chủ, mạng và chứng chỉ chính thức của khách hàng sẵn sàng muộn
  phase: GĐ2–GĐ3
  p: 2
  i: 2
  mitigation: Phát triển trên máy chủ thử; triển khai theo cấu hình; diễn tập gói offline nội bộ
  trigger: Chưa có câu trả lời Q1/Q3 khi bắt đầu đợt 3
  status: open
  i18n:
    en:
      title: The customer's official servers, network and certificates are ready late
      mitigation: Develop on a trial server; deploy by configuration; rehearse the internal offline package
      trigger: No answer to Q1/Q3 when batch 3 starts
- id: R07
  title: Chính sách cài đặt chặn ứng dụng (không ký mã, APK ngoài cửa hàng, không có MDM)
  phase: GĐ5
  p: 2
  i: 2
  mitigation: Hỏi sớm (Q4, Q5); xin chứng chỉ ký mã; hướng dẫn cài thủ công; bản web vẫn dùng được
  trigger: Câu trả lời Q4/Q5 là không
  status: open
  i18n:
    en:
      title: Installation policy blocks the apps (no code signing, APKs from outside the store, no MDM)
      mitigation: Ask early (Q4, Q5); obtain a code-signing certificate; manual install guide; the web version remains usable
      trigger: The answer to Q4/Q5 is no
- id: R08
  title: LLM bịa thông tin hoặc bỏ sót kết luận trong biên bản
  phase: GĐ2–GĐ7
  p: 2
  i: 2
  mitigation: Chấm điểm biên bản ở đợt 2; gắn nhãn bản nháp; truy vết về thời điểm trong bản ghi; bước duyệt của con người
  trigger: Phát hiện thông tin bịa khi kiểm thử hoặc UAT
  status: open
  i18n:
    en:
      title: The LLM invents information or omits conclusions in the minutes
      mitigation: Score the minutes in batch 2; label drafts; trace to the time in the transcript; human review step
      trigger: Invented information found during testing or UAT
- id: R09
  title: Khó có dữ liệu kiểm thử thực tế (đồng ý, bảo mật) trong tuần đầu
  phase: GĐ1
  p: 2
  i: 2
  mitigation: Họp đóng vai theo kịch bản có đồng ý; dữ liệu công khai để kiểm tra; hỏi Q7 ngay
  trigger: Ghi được dưới 1 giờ sau 3 ngày
  status: open
  i18n:
    en:
      title: Real test data (consent, confidentiality) is hard to get in the first week
      mitigation: Role-played meetings with a consent script; public data for checks; ask Q7 right away
      trigger: Less than 1 hour recorded after 3 days
- id: R10
  title: Xử lý sai dữ liệu mật trong phát triển (máy chủ thử qua VPN, CI trên cloud)
  phase: Tất cả
  p: 1
  i: 3
  mitigation: Chỉ dùng dữ liệu tổng hợp hoặc có đồng ý; không đưa dữ liệu thật lên đường phát triển khi chưa được phép
  trigger: Có yêu cầu thử bằng âm thanh cuộc họp thật
  status: open
  i18n:
    en:
      title: Confidential data is mishandled during development (trial server over VPN, cloud CI)
      mitigation: Use only synthetic or consented data; do not put real data on the development path without permission
      trigger: A request to test with real meeting audio
- id: R11
  title: Mẫu biên bản không đáp ứng yêu cầu thể thức
  phase: GĐ2–GĐ3
  p: 1
  i: 2
  mitigation: Thu thập mẫu chính thức (Q6); khách hàng duyệt biên bản sinh ra trước G3
  trigger: Khách hàng từ chối bố cục mẫu
  status: open
  i18n:
    en:
      title: The minutes template does not meet formal requirements
      mitigation: Collect the official templates (Q6); the customer approves generated minutes before G3
      trigger: The customer rejects the template layout
- id: R12
  title: Điện thoại Android dừng bộ ghi âm khi chạy nền
  phase: GĐ5
  p: 2
  i: 3
  mitigation: Plugin native với dịch vụ nền; hướng dẫn tắt tối ưu pin; kiểm thử ≥ 2 hãng
  trigger: Thiếu đoạn âm thanh trên một hãng máy
  status: open
  i18n:
    en:
      title: Android phones stop the recorder when it runs in the background
      mitigation: Native plugin with a background service; guide to turn off battery optimisation; test on at least 2 vendors
      trigger: Missing audio segments on one vendor's phone
- id: R13
  title: "Không kiểm chứng riêng trước khi làm ứng dụng: vấn đề nền tảng phát hiện muộn ở GĐ5"
  phase: GĐ5
  p: 1
  i: 2
  mitigation: MVP web không phụ thuộc ứng dụng; kiến trúc tách lớp ghi âm; plugin Kotlin dùng lại được nếu đổi khung
  trigger: Ma trận thiết bị không đạt ở lần đầu
  status: open
  i18n:
    en:
      title: "No separate validation before building the apps: platform problems are found late, in phase 5"
      mitigation: The web MVP does not depend on the apps; the recording layer is separated in the architecture; the Kotlin
        plugin is reusable if the framework changes
      trigger: The device matrix fails on the first run
- id: R14
  title: Độ chính xác nhận diện người nói thấp trong phòng họp thực tế
  phase: GĐ6
  p: 2
  i: 2
  mitigation: Kiểm chứng trước (6.1.2); cho phép sửa tên người nói; công bố độ chính xác thực tế
  trigger: Độ chính xác gán người nói < 85% trên dữ liệu thử
  status: open
  i18n:
    en:
      title: Speaker identification accuracy is low in real meeting rooms
      mitigation: Validate first (6.1.2); allow speaker names to be corrected; publish the accuracy actually achieved
      trigger: Speaker attribution accuracy below 85% on test data
- id: R16
  title: Thiếu dữ liệu tiếng Khmer để huấn luyện và đánh giá
  phase: GĐ7
  p: 3
  i: 2
  mitigation: Thu thập dữ liệu từ đơn vị có đồng bào Khmer; bắt đầu từ nhận dạng ngôn ngữ và đánh dấu; cam kết thấp hơn tiếng
    Việt
  trigger: Dưới 3 giờ dữ liệu Khmer khi bắt đầu đợt R3.2
  status: open
  i18n:
    en:
      title: Not enough Khmer data to train and evaluate
      mitigation: Collect data from units with Khmer communities; start with language identification and flagging; commit
        to less than for Vietnamese
      trigger: Less than 3 hours of Khmer data when batch R3.2 starts
- id: R17
  title: Mức độ sử dụng thấp ở một số đơn vị khi triển khai diện rộng
  phase: GĐ8
  p: 2
  i: 2
  mitigation: Giảng viên nguồn tại chỗ; video hướng dẫn; theo dõi số cuộc họp theo đơn vị
  trigger: Đơn vị không ghi cuộc họp nào trong 2 tuần
  status: open
  i18n:
    en:
      title: Low usage in some units during the wide rollout
      mitigation: On-site lead trainers; tutorial videos; track meetings per unit
      trigger: A unit records no meeting in 2 weeks
- id: R18
  title: Phụ thuộc một người trong thời gian bảo hành
  phase: GĐ9
  p: 2
  i: 3
  mitigation: Tài liệu vận hành đầy đủ; chuyển giao cho IT khách hàng; quy trình xử lý sự cố viết sẵn
  trigger: Sự cố không được xử lý trong SLA
  status: open
  i18n:
    en:
      title: Dependence on one person during the warranty
      mitigation: Complete operations documentation; hand over to the customer's IT; pre-written incident procedure
      trigger: An incident is not handled within the SLA
- id: R19
  title: Khách hàng góp ý muộn trên prototype làm chậm chốt tính năng
  phase: GĐ1
  p: 3
  i: 3
  mitigation: Buổi duyệt 01–02/10, chốt trước 07/10; phần chưa chốt để sau MVP
  trigger: Chưa có biên bản chốt tính năng vào ngày 07/10/2026
  status: open
  i18n:
    en:
      title: Late customer feedback on the prototype slows feature sign-off
      mitigation: Review sessions on 01–02/10, sign-off by 07/10; unsettled items go after the MVP
      trigger: No feature sign-off record on 07/10/2026
assumptions:
- id: A01
  kind: Mục tiêu
  text: Nghiệm thu MVP web trước tháng 12/2026 (mục tiêu 27/11/2026); ngày thực tế của các mốc được tính từ WBS.
  scope: GĐ1–GĐ3
  source: Yêu cầu của khách hàng
  status: Đã xác nhận
- id: A02
  kind: Nguồn lực
  text: "Đội 3 người toàn thời gian từ 28/09/2026 đến hết triển khai diện rộng: trưởng dự án, lập trình viên fullstack, kiểm\
    \ thử viên; mỗi vai trò 1 người. Bảo hành: trưởng dự án."
  scope: Tất cả
  source: Sheet Nguồn lực
  status: Chờ xác nhận
- id: A03
  kind: Nguồn lực
  text: "Tỷ lệ thời gian cho công việc chuyên môn: trưởng dự án 80% (20% quản lý, điều phối), lập trình viên 90%, kiểm thử\
    \ viên 90%."
  scope: Tất cả
  source: Tham số ở sheet Nguồn lực
  status: Đã xác nhận
- id: A04
  kind: Giả định
  text: Công của mỗi gói là ngày công ước lượng, đã gồm thiết kế chi tiết, kiểm thử và tài liệu.
  scope: Tất cả
  source: —
  status: Đã xác nhận
- id: A05
  kind: Giả định
  text: Mỗi vai trò làm lần lượt các gói của mình theo thứ tự thực hiện; một gói chỉ bắt đầu khi các gói phụ thuộc đã xong.
  scope: Tất cả
  source: Cột Phụ thuộc trong WBS
  status: Đã xác nhận
- id: A06
  kind: Giả định
  text: Ước lượng từ GĐ5 trở đi là sơ bộ (±30%), sẽ ước lượng lại khi bắt đầu mỗi giai đoạn.
  scope: GĐ5–GĐ8
  source: Ước lượng lại tại 5.1, 6.1.5, 7.1.4
  status: Đã xác nhận
- id: A07
  kind: Giả định
  text: Phạm vi sau MVP (ứng dụng, R2, R3, triển khai) là đề xuất, chờ hợp đồng/phê duyệt.
  scope: GĐ4–GĐ8
  source: Phê duyệt tại G6
  status: Chờ xác nhận
- id: A08
  kind: Giả định
  text: Thời gian bảo hành 12 tháng sau nghiệm thu tổng thể.
  scope: GĐ9
  source: Theo hợp đồng
  status: Chờ xác nhận
- id: A09
  kind: Phụ thuộc
  text: Máy chủ thử của khách hàng có GPU, truy cập được qua VPN phát triển từ tuần đầu.
  scope: GĐ1–GĐ2
  source: Đã có quyền truy cập
  status: Chờ xác nhận
- id: A10
  kind: Phụ thuộc
  text: Khách hàng trả lời Q1 (máy chủ), Q6 (mẫu biên bản), Q7 (ghi dữ liệu thử) trước 02/10/2026.
  scope: GĐ1
  source: Câu hỏi mở
  status: Chờ xác nhận
- id: A11
  kind: Phụ thuộc
  text: Khách hàng cung cấp máy chủ chính thức trước đợt 3 của GĐ2.
  scope: GĐ2–GĐ3
  source: Câu hỏi Q1
  status: Chờ xác nhận
- id: A12
  kind: Phụ thuộc
  text: Khách hàng cử người dùng thật tham gia UAT và thí điểm.
  scope: GĐ3, GĐ4
  source: Câu hỏi Q12
  status: Chờ xác nhận
- id: A14
  kind: Ràng buộc
  text: MVP chạy trên Chrome/Edge bản hiện hành trên laptop Windows 10/11; khi ghi âm người dùng giữ tab mở và cắm sạc. Điện
    thoại dùng để xem và duyệt biên bản.
  scope: GĐ2–GĐ4
  source: ADR-001
  status: Đã xác nhận
- id: A15
  kind: Ràng buộc
  text: Sản phẩm cuối khuyến nghị ghi âm bằng ứng dụng Windows và Android (GĐ5); web vẫn dùng để xem, soạn, quản trị.
  scope: GĐ5 trở đi
  source: ADR-001
  status: Đã xác nhận
- id: A16
  kind: Ràng buộc
  text: Không làm iOS/macOS.
  scope: Tất cả
  source: ADR-001
  status: Đã xác nhận
- id: A17
  kind: Ràng buộc
  text: Không phụ thuộc internet khi vận hành; không dùng dịch vụ cloud.
  scope: Tất cả
  source: ADR-005, ADR-007
  status: Đã xác nhận
- id: A18
  kind: Ràng buộc
  text: "Nội dung cuộc họp là dữ liệu mật: không ghi log nội dung, mã hóa khi lưu."
  scope: Tất cả
  source: Quy tắc bảo mật của dự án
  status: Đã xác nhận
- id: A19
  kind: Ràng buộc
  text: Không trang bị thiết bị phòng họp; một thiết bị thu cho phòng 10–15 người.
  scope: Tất cả
  source: Họp khách hàng 24/09/2026
  status: Đã xác nhận
- id: A20
  kind: Ràng buộc
  text: MVP chỉ cam kết tiếng Việt; tiếng Khmer ở R3.
  scope: GĐ2, GĐ7
  source: Quyết định 25/09/2026
  status: Đã xác nhận
