schema_version: 1
start: 2026-09-28
phases:
- code: "0"
  name: Khởi động dự án
  label: GĐ0
  objective: Khởi động lại dự án theo phạm vi đã thống nhất với khách hàng ngày 24/09/2026.
  in_scope: Chốt phạm vi mới; kho mã nguồn và quy tắc phát triển; quyết định kiến trúc ADR-001 đến ADR-008; tầm nhìn, bản
    đồ tính năng, yêu cầu phi chức năng, câu hỏi mở; định hướng thiết kế và mockup v1; WBS, kế hoạch và bảng quản lý công
    việc.
  out_scope: Viết mã sản phẩm.
  deliverables: Kho mã nguồn ivai-dev/ai-minute; bộ ADR; tài liệu yêu cầu; mockup v1; kế hoạch tổng thể; ticket trên GitHub
    Project.
  exit: Hoàn thành.
  risks: —
  i18n:
    en:
      name: Initiation
- code: "1"
  name: Chuẩn bị và xác nhận kỹ thuật
  label: GĐ1
  objective: Có đủ dữ liệu, mô hình ASR đã chọn, kiến trúc, thiết kế và nền tảng kỹ thuật để xây dựng từ tuần thứ 3.
  in_scope: Bộ dữ liệu kiểm thử tiếng Việt và công cụ đo; chọn mô hình ASR (2 ứng viên) và cấu hình GPU; kiến trúc hệ thống;
    prototype sản phẩm đầy đủ, buổi duyệt và chốt tính năng với khách hàng; thống nhất phạm vi và NFR; công cụ phát triển,
    CI, khung web, token thiết kế, khung backend, staging, giao thức ghi âm; chiến lược kiểm thử.
  out_scope: "Kiểm chứng riêng (spike) cho ứng dụng desktop/mobile và LLM: thực hiện trực tiếp trong các hạng mục xây dựng."
  deliverables: ADR-009 (mô hình ASR, cấu hình GPU); bộ dữ liệu ≥ 2 giờ; công cụ đo; tài liệu kiến trúc; prototype đã duyệt,
    biên bản chốt tính năng; CI xanh; staging chạy; story đợt 1.
  exit: "G1: mô hình ASR và cấu hình GPU đã chốt; khách hàng đã duyệt prototype và phạm vi MVP."
  risks: Độ chính xác ASR với micro laptop; khách hàng trả lời chậm; khó có dữ liệu thực tế.
  i18n:
    en:
      name: Preparation and technical validation
- code: "2"
  name: Xây dựng MVP web
  label: GĐ2
  objective: Xây dựng toàn bộ luồng chính của MVP trên trình duyệt.
  in_scope: "Đợt 1: bộ ghi âm web, nhận âm thanh, ASR streaming, bản ghi trực tiếp, đăng nhập và cô lập dữ liệu theo đơn vị,\
    \ cuộc họp. Đợt 2: tự khôi phục khi mất mạng hoặc tải lại tab, nhận dạng lượt 2, rà soát bản ghi, sinh biên bản theo mẫu,\
    \ trình soạn, xuất DOCX/PDF, in, tìm kiếm cơ bản, từ khóa nhận dạng. Đợt 3: duyệt biên bản, script tạo đơn vị và tài khoản,\
    \ giao diện di động để xem và duyệt, nhật ký kiểm toán, gói cài đặt offline, sao lưu, giám sát cơ bản. Ổn định: ma trận\
    \ độ tin cậy, kiểm thử hiệu năng và đầu-cuối, diễn tập cài đặt, sửa lỗi."
  out_scope: Ứng dụng desktop và Android (GĐ5); nhận diện người nói, nhiều thiết bị thu, lịch họp, quản trị, thống kê (R2).
  deliverables: Bản phát hành ứng viên (RC) chạy trên Chrome/Edge; gói cài đặt offline máy chủ; báo cáo kiểm thử.
  exit: G2 demo ghi âm và bản ghi trực tiếp; G3 demo toàn bộ luồng chính; G4 bản RC đạt ma trận độ tin cậy, kiểm thử hiệu
    năng, diễn tập cài đặt offline.
  risks: Ghi âm trên trình duyệt phụ thuộc thao tác người dùng; độ trễ khi nhiều cuộc họp trên một GPU.
  i18n:
    en:
      name: Build the web MVP
- code: "3"
  name: UAT và nghiệm thu MVP
  label: GĐ3
  objective: Khách hàng nghiệm thu MVP web trên máy chủ của mình.
  in_scope: Hướng dẫn vận hành và hướng dẫn nhanh cho thư ký; cài đặt từ gói offline tại máy chủ khách hàng; UAT với người
    dùng thật; sửa lỗi; biên bản nghiệm thu.
  out_scope: Tính năng mới.
  deliverables: Hệ thống MVP chạy tại khách hàng; tài liệu hướng dẫn; biên bản nghiệm thu MVP.
  exit: "G5: khách hàng nghiệm thu MVP theo kịch bản đã thống nhất (trước 12/2026)."
  risks: Máy chủ chính thức của khách hàng sẵn sàng muộn.
  i18n:
    en:
      name: UAT and MVP acceptance
- code: "4"
  name: Thí điểm và ổn định
  label: GĐ4
  objective: Vận hành thật tại 2–3 đơn vị bằng bản web, đo chỉ số thực tế và ổn định hệ thống.
  in_scope: Cài đặt và đào tạo tại đơn vị thí điểm; hỗ trợ trực tiếp; theo dõi chỉ số (độ trễ, độ chính xác, tỉ lệ gián đoạn
    ghi âm, thời gian soạn biên bản); thu thập phản hồi; bản cập nhật 1.1.
  out_scope: Tính năng lớn mới.
  deliverables: Bản 1.1; báo cáo đánh giá thí điểm; đề xuất ưu tiên cho ứng dụng và R2.
  exit: "G6: chỉ số thí điểm đạt, không còn lỗi nghiêm trọng."
  risks: Người dùng chưa quen; điều kiện phòng họp thực tế khác phòng thử.
  i18n:
    en:
      name: Pilot and stabilization
- code: "5"
  name: Ứng dụng desktop và mobile
  label: GĐ5
  objective: Đưa ra ứng dụng Windows và Android – cách dùng được khuyến nghị của sản phẩm cuối – để ghi âm ổn định khi chạy
    nền, khóa màn hình, mất mạng.
  in_scope: "Ứng dụng Windows (Electron): bộ ghi âm ở tiến trình chính, lưu cục bộ có mã hóa, khôi phục sau sự cố, bộ cài\
    \ có ký mã, tự cập nhật từ máy chủ nội bộ. Ứng dụng Android (Capacitor + plugin Kotlin): dịch vụ ghi âm nền, mã hóa bằng\
    \ Android Keystore, phân phối APK. Ghi âm khi chưa kết nối máy chủ. Kiểm thử độ tin cậy trên laptop và 2–3 hãng điện thoại."
  out_scope: iOS/macOS (ngoài phạm vi dự án).
  deliverables: Bản phát hành 1.5 gồm ứng dụng Windows và Android; tài liệu và đào tạo cho ứng dụng.
  exit: "G7: ứng dụng đạt ma trận độ tin cậy và được khách hàng chấp nhận."
  risks: Điện thoại Android dừng ghi nền; chính sách cài đặt phần mềm của cơ quan (ký mã, APK, MDM).
  i18n:
    en:
      name: Windows and Android apps
- code: "6"
  name: Phát hành R2
  label: GĐ6
  objective: Bổ sung các tính năng quản lý cuộc họp và nhận diện người nói.
  in_scope: Nhận diện người nói (đăng ký giọng nói); nhiều thiết bị thu cho một cuộc họp; micro rời/hội nghị; lịch họp, mời
    họp, nhắc lịch; phòng họp; độ mật và quy tắc truy cập; màn quản trị đơn vị và quản trị hệ thống; thống kê, báo cáo định
    kỳ, trung tâm thông báo; chính sách lưu trữ; tìm kiếm toàn văn; giao diện tối; các hạng mục P2 từ MVP.
  out_scope: SSO, tiếng Khmer, hỏi đáp trên kho biên bản (R3).
  deliverables: Bản phát hành 2.0; tài liệu cập nhật; biên bản nghiệm thu R2.
  exit: "G8: khách hàng nghiệm thu R2."
  risks: Độ chính xác nhận diện người nói; khối lượng màn quản trị và thống kê.
  i18n:
    en:
      name: Release 2
- code: "7"
  name: Phát hành R3
  label: GĐ7
  objective: Mở rộng tích hợp, ngôn ngữ và khai thác kho biên bản.
  in_scope: Đăng nhập một lần (SSO); họp định kỳ; tiếng Khmer, nhận dạng ngôn ngữ và dịch; tìm kiếm ngữ nghĩa và hỏi đáp;
    mở rộng nhiều máy chủ/HA; kiểm thử bảo mật.
  out_scope: iOS/macOS.
  deliverables: Bản phát hành 3.0; báo cáo kiểm thử bảo mật; biên bản nghiệm thu R3.
  exit: "G9: khách hàng nghiệm thu R3."
  risks: Thiếu dữ liệu tiếng Khmer; phụ thuộc hệ thống của bên thứ ba khi tích hợp.
  i18n:
    en:
      name: Release 3
- code: "8"
  name: Triển khai diện rộng và chuyển giao
  label: GĐ8
  objective: Đưa hệ thống đến các đơn vị còn lại và chuyển giao cho đội IT khách hàng.
  in_scope: Kế hoạch triển khai theo đợt; tài liệu và video hướng dẫn; đào tạo giảng viên nguồn; triển khai 3 đợt; hỗ trợ
    sau triển khai; chuyển giao tài liệu, mã nguồn, cấu hình; nghiệm thu tổng thể.
  out_scope: Phát triển tính năng mới.
  deliverables: Hệ thống vận hành tại các đơn vị; bộ hồ sơ chuyển giao; biên bản nghiệm thu tổng thể.
  exit: "G10: nghiệm thu tổng thể và chuyển giao."
  risks: Mức độ sử dụng thấp ở một số đơn vị; năng lực tiếp nhận của đội IT khách hàng.
  i18n:
    en:
      name: Rollout and handover
- code: "9"
  name: Bảo hành và hỗ trợ vận hành
  label: GĐ9
  objective: Duy trì hệ thống ổn định, an toàn trong thời gian bảo hành (giả định 12 tháng).
  in_scope: Hỗ trợ và xử lý sự cố theo SLA; bản vá bảo mật và cập nhật phụ thuộc hàng tháng; cập nhật mô hình hàng quý; kiểm
    tra sao lưu và khôi phục hàng quý; báo cáo vận hành hàng tháng; đánh giá cuối kỳ.
  out_scope: Tính năng mới (thực hiện theo yêu cầu thay đổi riêng).
  deliverables: 12 báo cáo vận hành tháng; các bản vá; báo cáo kết thúc bảo hành.
  exit: "G11: kết thúc bảo hành."
  risks: Phụ thuộc một người trong thời gian bảo hành; thay đổi hạ tầng phía khách hàng.
  i18n:
    en:
      name: Warranty (12 months)
- code: "10"
  name: Quản lý dự án (xuyên suốt)
  label: QL
  objective: Điều hành, kiểm soát và bảo đảm chất lượng xuyên suốt từ khởi động đến chuyển giao.
  in_scope: Báo cáo tuần; điều phối đội; họp cổng và demo; quản lý rủi ro, thay đổi, cấu hình và phát hành; rà soát bảo mật
    mỗi bản phát hành; kiểm soát dữ liệu mật.
  out_scope: —
  deliverables: Báo cáo tuần; biên bản họp cổng; sổ rủi ro và nhật ký thay đổi cập nhật.
  exit: Theo từng cổng G1–G10.
  risks: —
  i18n:
    en:
      name: Project management (throughout)
