rules:
  owners_by_role: true
  synthetic_data_only: true
  forbidden_phrases:
  - \bClaude\b
  - AI[- ]assist
  - \bLLM[- ]assisted estimate
security:
- "Never log, print, or send to analytics any meeting content: audio, transcript text, minutes text, document text, participant\
  \ names."
- "No cloud SaaS at runtime: no Firebase, Sentry cloud, Crashlytics, Google Fonts or CDN assets, telemetry SDKs, or cloud\
  \ editions of libraries. Bundle fonts and assets."
- Every server address is configuration, never a hard-coded public host.
- Before adding a dependency, check that it does not phone home at runtime. Note the result in the PR.
- Never commit secrets, tokens, certificates, signing keys, recordings, or real meeting data. Test fixtures must be synthetic
  or explicitly cleared for use.
- "Shells are hardened: Electron with contextIsolation, sandbox, no nodeIntegration, strict CSP, no remote content; Capacitor\
  \ with cleartext disabled and no live reload in release builds."
- Tailscale is only the development path to the customer's trial server (ADR-005). Do not build product features that depend
  on it.
fe:
  dir: "."
  app: apps/web
  ux_spec: docs/05-design/ux-spec.md
  forbidden:
  - Tailscale
  - \b100\.64\.
