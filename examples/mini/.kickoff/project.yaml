schema_version: 1
name: Library Loans
languages:
  repo: en
  chat: en
  workbook: en
  ui: en
docs_root: docs
date_format: "%d/%m/%Y"
calendar:
  weekend: [sat, sun]
  holidays: []
roles:
  - id: librarian
    name: Librarian
    focus: 0.8
    duties: Lends and takes back books at the desk
  - id: member
    name: Member
    focus: 0.9
    duties: Borrows books and follows their loans on the phone
  - id: admin
    name: Administrator
    focus: 0.9
    duties: Runs the library and reads the monthly report
  - id: lead
    name: Project lead
    focus: 0.8
    duties: Project management, customer contact, architecture
  - id: dev
    name: Developer
    focus: 0.9
    duties: Implementation
  - id: qa
    name: QA
    focus: 0.9
    duties: Test data, test automation, UAT support
releases: [MVP, R2]
hard_dates:
  G1: 2026-10-30
rules:
  owners_by_role: true
  synthetic_data_only: true
  forbidden_phrases: []
security: []
design:
  ux_spec: docs/05-design/ux-spec.md
  forbidden: ["\\bVPN\\b"]
