<!doctype html>
<meta charset="utf-8" />
<title>Prototype check at 390 px</title>
<!--
  Headless Edge and Chrome clamp --window-size to about 500 px wide, so a "390 px" dump of the
  prototype itself still has a ~520 px layout. This wrapper loads index.html (same folder) in a
  390 x 844 iframe, so the page inside gets a true 390 px viewport.
  Usage: narrow.html#<route> (the hash is passed to the prototype unchanged). Needs
  --allow-file-access-from-files when opened from disk.
  After a wait (8 s for a #scn- route, which runs a guided scenario; 3 s otherwise) it sets on
  its own <html>:
    data-err="<message>"  the prototype set data-err, a scenario did not finish, or the page
                          (or a scroll container inside it) is wider than 390 px;
    data-ok="narrow"      otherwise.
  Tables scroll inside their own .table-wrap and are not counted.
-->
<style>
  html,
  body {
    margin: 0;
    background: gray;
  }
  iframe {
    display: block;
    width: 390px;
    height: 844px;
    border: 0;
    background: white;
  }
</style>
<iframe id="f" title="Prototype at 390 px"></iframe>
<script charset="utf-8">
  const f = document.getElementById("f");
  const scenario = location.hash.startsWith("#scn-");
  f.src = "index.html" + location.hash;
  const report = (msg) => {
    document.documentElement.dataset.err = String(msg).slice(0, 200);
  };
  setTimeout(() => {
    let doc;
    try {
      doc = f.contentDocument;
    } catch (e) {
      report("narrow: cannot read the iframe (" + e.message + ")");
      return;
    }
    if (!doc || !doc.documentElement) {
      report("narrow: iframe not loaded");
      return;
    }
    const html = doc.documentElement;
    if (html.dataset.err) {
      report(html.dataset.err);
      return;
    }
    if (html.dataset.ready !== "1") {
      report("narrow: prototype not ready");
      return;
    }
    if (scenario && html.dataset.scenario !== "done") {
      report("narrow: scenario did not finish (" + (html.dataset.scenario || "not started") + ")");
      return;
    }
    const page = doc.scrollingElement || html;
    if (page.scrollWidth > 390) {
      report("narrow-overflow: page " + page.scrollWidth + ">390");
      return;
    }
    // A scroll container wider than its own box also means horizontal scrolling at 390 px.
    const wide = [...doc.querySelectorAll("#app *")].find((el) => {
      if (el.scrollWidth <= el.clientWidth + 1) return false;
      const ox = getComputedStyle(el).overflowX;
      return (ox === "auto" || ox === "scroll") && !el.closest(".table-wrap");
    });
    if (wide) {
      report("narrow-overflow: " + (wide.getAttribute("class") || wide.tagName) + " " + wide.scrollWidth + ">" + wide.clientWidth);
      return;
    }
    document.documentElement.dataset.ok = "narrow";
  }, scenario ? 8000 : 3000);
</script>
