/* ---------- Inputs and fields ---------- */
.field { display: flex; flex-direction: column; gap: var(--label-gap); min-width: 0; }

.field[data-w="tax"] { --fw-max: var(--w-tax); } .field[data-w="id"] { --fw-max: var(--w-id); }

.cbg-l { display: grid; gap: 0 var(--col-gap); }

.fd-zone { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); padding: var(--card-p); border: 1px dashed var(--line-strong); border-radius: var(--card-r); background: var(--surface-2); text-align: center; color: var(--ink-2); }
.fd-zone.over { border-color: var(--primary); background: var(--primary-soft); }
.fd-t { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; justify-content: center; }
.fd-errs { display: flex; flex-direction: column; gap: var(--sp-1); }
.fd-errs .err { font: var(--t-meta); color: var(--danger-ink); display: flex; gap: var(--sp-1h); align-items: center; }
.fd-list { list-style: none; display: flex; flex-direction: column; gap: var(--sp-1); }
.fd-f { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3); border: 1px solid var(--line); border-radius: var(--r-md); }
.fd-f .grow { display: flex; flex-direction: column; }
.fd-bar { display: block; height: 4px; margin-top: var(--sp-1); border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.fd-bar > span { display: block; height: 100%; background: var(--primary); }
.err-t { color: var(--danger-ink); }
.dc-v { font-weight: var(--fw-semibold); }
.filter-on { background: var(--primary-soft); border-color: transparent; color: var(--primary-ink); }

/* ---------- Pills, chips, badges ---------- */
.pill {
  --p-bg: var(--surface-3); --p-fg: var(--ink-2);
  display: inline-flex; align-items: center; gap: var(--sp-1); min-height: var(--tag-h); padding: 0 var(--sp-2); border-radius: 999px;
  background: var(--p-bg); color: var(--p-fg); font: var(--t-meta); font-weight: var(--fw-medium); white-space: nowrap;
}
.pill .ic { width: var(--ic-sm); height: var(--ic-sm); }
.pill.ok { --p-bg: var(--ok-soft); --p-fg: var(--ok-ink); }
.pill.warn { --p-bg: var(--warn-soft); --p-fg: var(--warn-ink); }
.pill.danger { --p-bg: var(--danger-soft); --p-fg: var(--danger-ink); }
.pill.info { --p-bg: var(--primary-soft); --p-fg: var(--primary-ink); }
.pill.accent { --p-bg: var(--accent-soft); --p-fg: var(--accent-ink); }
.pill.line { --p-bg: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }
.chip {
  display: inline-flex; align-items: center; gap: var(--sp-1h); min-height: var(--chip-h); padding: 0 calc(var(--ctl-px) - 4px);
  border-radius: var(--chip-r); border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: var(--t-label); white-space: nowrap; cursor: pointer; transition: background-color var(--dur-1), border-color var(--dur-1), color var(--dur-1);
}
@media (hover: hover) { .chip:hover { border-color: var(--line-strong); } }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-ink); }
.chip[aria-disabled="true"] { color: var(--ink-3); background: var(--surface-3); border-color: transparent; cursor: not-allowed; }
.chip .ic { width: var(--ic-sm); height: var(--ic-sm); }
.chip.filter { min-height: var(--chip-h-filter, var(--chip-h)); }
.chip .chev { transition: transform var(--dur-1) var(--ease-standard); }
.chip[aria-expanded="true"] .chev { transform: rotate(180deg); }
.count { display: inline-grid; place-items: center; min-width: 20px; min-height: 20px; padding: 0 var(--sp-1h); border-radius: 999px; background: var(--surface-3); color: var(--ink-2); font: var(--t-meta); font-weight: var(--fw-medium); font-variant-numeric: tabular-nums; }
:is([data-density="comfortable"], [data-density="touch"]) .count { min-width: 24px; min-height: 24px; }
.count.zero { color: var(--ink-3); background: transparent; }
.count.info { background: var(--primary-soft); color: var(--primary-ink); }
.count.warn { background: var(--warn-soft); color: var(--warn-ink); }
.count.danger { background: var(--danger-soft); color: var(--danger-ink); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--primary-soft); color: var(--primary-ink); flex-shrink: 0; }
.mark { width: 32px; height: 32px; border-radius: var(--r-md); background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex-shrink: 0; }
.mark.xs { width: 20px; height: 20px; border-radius: var(--r-sm); }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--card-r); min-width: 0; }
.card-h { display: flex; align-items: center; gap: var(--gap-head); min-height: var(--card-head-h); padding: 0 var(--card-p); border-bottom: 1px solid var(--line); flex-wrap: nowrap; }
.card-h .ch-col { display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1 1 auto; padding-block: var(--sp-1h); }
.card-h .ch-t { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.card-h .ch-t > h2, .card-h .ch-t > h3 { min-width: 0; }
.card-h .ch-act { display: flex; align-items: center; gap: var(--sp-2); flex-shrink: 0; }
.card-b { padding: var(--card-p); display: flex; flex-direction: column; gap: var(--gap-group); }
.card-flush { display: flex; flex-direction: column; }
.card.tone-sunken { background: var(--surface-2); }
.card.tone-info { background: var(--primary-soft); border-color: transparent; }
.card.tone-warn { background: var(--warn-soft); border-color: transparent; }
.card .card { border-color: transparent; box-shadow: none; } /* one-box rule: a card inside a card is level 2 */
.empty { display: flex; flex-direction: column; align-items: center; gap: var(--gap-group); padding: var(--section-gap) var(--card-p); text-align: center; color: var(--ink-2); }
.empty .ic-wrap { width: 48px; height: 48px; border-radius: var(--r-lg); background: var(--surface-3); display: grid; place-items: center; color: var(--ink-3); }
.empty .empty-art { width: var(--empty-art); height: var(--empty-art); display: grid; place-items: center; }
.empty .empty-t { font: var(--t-title-l); color: var(--ink); }
.empty-txt { max-width: 52ch; font: var(--t-body); }
.banner { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-3) var(--card-p); border-radius: var(--card-r); background: var(--primary-soft); color: var(--primary-ink); font: var(--t-body); }
.banner.warn { background: var(--warn-soft); color: var(--warn-ink); }
.banner.ok { background: var(--ok-soft); color: var(--ok-ink); }
.banner.danger { background: var(--danger-soft); color: var(--danger-ink); }
.banner .ic { margin-top: 2px; }
.banner .bn-b { display: flex; flex-direction: column; gap: var(--gap-inner); flex: 1 1 auto; min-width: 0; }
.banner .bn-t { font-weight: var(--fw-semibold); }
.banner .bn-act { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-1); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: var(--gap-grid); }

/* ---------- Structure and feedback ---------- */
.ph-meta { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-3); }
.sec-h { display: flex; align-items: center; gap: var(--sp-2); }
.sec-h > h2, .sec-h > h3 { display: inline-flex; align-items: center; gap: var(--sp-2); }
.subnav { display: flex; gap: var(--sp-1); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.subnav a { display: inline-flex; align-items: center; min-height: var(--ctl-h); padding: 0 var(--sp-3); color: var(--ink-2); font: var(--t-label); text-decoration: none; white-space: nowrap; box-shadow: inset 0 -2px 0 transparent; }
.subnav a:hover { color: var(--ink); }
.subnav a[aria-current="page"] { color: var(--primary-ink); box-shadow: inset 0 -2px 0 var(--primary); }
.tabs { display: flex; flex-wrap: wrap; gap: 0 var(--sp-1); border-bottom: 1px solid var(--line); }
.tab { display: inline-flex; align-items: center; gap: var(--sp-1h); min-height: var(--ctl-h); padding: 0 var(--sp-3); border: 0; background: none; color: var(--ink-2); font: var(--t-label); white-space: nowrap; box-shadow: inset 0 -2px 0 transparent; transition: color var(--dur-1), box-shadow var(--dur-1); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--primary-ink); box-shadow: inset 0 -2px 0 var(--primary); }
.tabs-sel .select { width: auto; }
.stepper { display: flex; flex-direction: column; gap: var(--sp-2); }
.st-l { list-style: none; display: flex; gap: var(--sp-1); }
.st-i { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1); font: var(--t-meta); color: var(--ink-3); }
.st-i::before { content: ""; height: 4px; border-radius: 2px; background: var(--surface-3); }
.st-i.done::before, .st-i.cur::before { background: var(--primary); }
.st-i.cur { color: var(--ink); font-weight: var(--fw-medium); }
.stepper.v-dots .st-l { gap: var(--sp-2); justify-content: center; }
.stepper.v-dots .st-i { flex: 0 0 auto; }
.stepper.v-dots .st-i::before { width: 8px; height: 8px; border-radius: 50%; }
.st-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-block: .12em; margin-block: -.12em; }
.pager { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.pager.more { flex-direction: column; align-items: center; gap: var(--sp-2); }
.pg-btns { display: inline-flex; align-items: center; gap: 2px; }
.pg-n { min-width: var(--ctl-h-sm); padding-inline: var(--sp-1h); font-variant-numeric: tabular-nums; }
.pg-gap { min-width: 24px; text-align: center; color: var(--ink-3); }
.pg-size .select { width: auto; }
.reveal { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-4) var(--ease-standard); }
.reveal[data-open="true"] { grid-template-rows: 1fr; }
.reveal > * { min-height: 0; overflow: hidden; }
.disc { display: flex; flex-direction: column; }
.disc-b { display: flex; align-items: center; gap: var(--sp-2); min-height: var(--ctl-h); padding: 0; border: 0; background: none; color: var(--ink); font: var(--t-label); text-align: left; }
.disc-b .chev { transition: transform var(--dur-1) var(--ease-standard); }
.disc-b[aria-expanded="true"] .chev { transform: rotate(180deg); }
.disc .reveal > * > * { padding-top: var(--sp-2); }
.errsum { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--card-p); border: 2px solid var(--danger); border-radius: var(--card-r); background: var(--surface); outline: none; }
.errsum ul { padding-left: var(--sp-5); }
.errsum a { color: var(--danger-ink); }
.skel { display: flex; flex-direction: column; gap: var(--sp-2); }
.skel-i { display: block; height: var(--row-h); border-radius: var(--r-sm); background: var(--surface-3); }
.skel.s-text .skel-i { height: 1em; } .skel.s-card .skel-i { height: 120px; } .skel.s-chart .skel-i { height: 200px; }
.meter { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
.meter-l { display: flex; justify-content: space-between; gap: var(--sp-2); font: var(--t-meta); color: var(--ink-2); }
.meter-t { display: block; height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
[data-density="kiosk"] .meter-t { height: 12px; }
.meter-f { display: block; height: 100%; border-radius: inherit; background: var(--primary); }
.meter.tone-ok .meter-f { background: var(--ok); }
.meter.tone-warn .meter-f { background: var(--warn); }
.meter.tone-neutral .meter-f { background: var(--ink-3); }
.num-x { display: inline-block; }
.num-v { display: inline-block; animation: kit-in var(--dur-2) var(--ease-linear); }
.job { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--card-p); border: 1px solid var(--line); border-radius: var(--card-r); background: var(--surface); }
/* EntityCard: fixed slots; the title link stretches over the card; inner actions sit above it. */
.ec { position: relative; display: flex; flex-direction: column; gap: var(--gap-group); padding: var(--card-p); border: 1px solid var(--line); border-radius: var(--card-r); background: var(--surface); min-width: 0; transition: border-color var(--dur-1); }
.ec:hover { border-color: var(--line-strong); }
.ec:has(.ec-link:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
.ec.sel { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.ec-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0 var(--sp-3); align-items: start; }
.ec-media { grid-column: 1; display: grid; place-items: center; width: 48px; height: 48px; border-radius: var(--card-r); background: var(--surface-3); overflow: hidden; }
[data-density="compact"] .ec-media { width: 40px; height: 40px; }
[data-density="kiosk"] .ec-media { width: 64px; height: 64px; }
.ec-tt { grid-column: 2; display: flex; flex-direction: column; gap: var(--gap-inner); min-width: 0; }
.ec-head:not(:has(.ec-media)) .ec-tt { grid-column: 1 / 3; }
.ec-badge { grid-column: 3; justify-self: end; }
.ec-title { font: var(--t-title); margin: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; padding-block: .12em; margin-block: -.12em; text-wrap: pretty; }
[data-density="kiosk"] .ec-title { -webkit-line-clamp: 3; line-clamp: 3; }
.ec-link { color: var(--ink); text-decoration: none; }
.ec-link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.ec-link:focus-visible { outline: none; }
.ec-link:hover { text-decoration: underline; text-decoration-thickness: 1px; }
.ec-sub { font: var(--t-body-s); color: var(--ink-2); }
.ec-fig { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); min-height: 1.5em; }
.ec-f1 { color: var(--ink); }
.ec-meta { list-style: none; display: flex; flex-direction: column; gap: var(--gap-inner); font: var(--t-body-s); color: var(--ink-2); }
.ec-meta li { display: flex; align-items: center; gap: var(--sp-2); }
.ec-meta li .ic { color: var(--ink-3); }
.ec-body { font: var(--t-body-s); color: var(--ink-2); }
.ec-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-top: auto; }
.ec-facts { display: flex; gap: var(--sp-1h); min-width: 0; overflow: hidden; white-space: nowrap; }
.ec-fact { display: inline-flex; align-items: center; min-height: var(--tag-h); padding: 0 var(--sp-2); border-radius: 999px; background: var(--surface-3); color: var(--ink-2); font: var(--t-meta); }
.ec-act { position: relative; z-index: 1; display: inline-flex; gap: var(--sp-2); flex-shrink: 0; }
.ec-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "head fig" "meta fig" "foot foot"; gap: var(--sp-1) var(--sp-4); }
.ec-row .ec-head { grid-area: head; } .ec-row .ec-fig { grid-area: fig; align-self: start; flex-direction: column; align-items: flex-end; }
.ec-row .ec-meta { grid-area: meta; flex-direction: row; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); }
.ec-row .ec-title { -webkit-line-clamp: 1; line-clamp: 1; }
.ec-row .ec-foot { grid-area: foot; } .ec-row .ec-body { grid-column: 1 / -1; }
.lrow { position: relative; display: flex; align-items: center; gap: var(--sp-3); min-height: var(--list-h); padding: var(--sp-2) var(--card-p); border-bottom: 1px solid var(--line); }
.lrow.two { min-height: var(--list-h-2); }
.lrow.sel { background: var(--primary-soft); box-shadow: inset 3px 0 0 var(--primary); }
.lr-lead { flex-shrink: 0; display: grid; place-items: center; }
.lr-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: var(--gap-inner); }
.lr-t { font: var(--t-body); font-weight: var(--fw-semibold); color: var(--ink); text-decoration: none; }
a.lr-t::after { content: ""; position: absolute; inset: 0; }
a.lr-t:hover { text-decoration: underline; }
.lr-s, .lr-f { flex-shrink: 0; }
.lr-a { position: relative; z-index: 1; flex-shrink: 0; display: inline-flex; gap: var(--sp-1); }
.sl { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-3) var(--sp-6); margin: 0; }
.sl.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1199.98px) { .sl.c2 { grid-template-columns: minmax(0, 1fr); } }
.sl-r { display: grid; grid-template-columns: minmax(120px, 2fr) minmax(0, 3fr) auto; gap: var(--sp-1) var(--sp-3); align-items: baseline; }
.sl-k { font: var(--t-body-s); color: var(--ink-3); margin: 0; }
.sl-v { font: var(--t-body); color: var(--ink); margin: 0; overflow-wrap: anywhere; }
.sl-v.empty-v { color: var(--ink-3); }
.sl-a { margin: 0; }
.tl { list-style: none; display: flex; flex-direction: column; gap: var(--gap-group); }
.tl-i { position: relative; display: flex; gap: var(--sp-3); }
.tl-dot { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--line-strong); flex-shrink: 0; }
.tl-i.tone-ok .tl-dot { background: var(--ok); } .tl-i.tone-warn .tl-dot { background: var(--warn); } .tl-i.tone-danger .tl-dot { background: var(--danger); }
.tl-b { display: flex; flex-direction: column; gap: var(--gap-inner); min-width: 0; }
.tl-q { font: var(--t-body); color: var(--ink-2); padding-left: var(--sp-3); border-left: 2px solid var(--line); }
.tl.dense { gap: var(--sp-2); }
.abar { display: flex; align-items: center; gap: var(--sp-3); min-height: var(--bar-h); padding: 0 var(--card-p); background: var(--surface); border-top: 1px solid var(--line); }
.abar.sticky { position: sticky; bottom: 0; z-index: var(--z-sticky); box-shadow: 0 -4px 12px -8px rgba(16, 41, 43, .12); }
.abar-s { flex: 1 1 auto; min-width: 0; }
.abar-a { display: flex; gap: var(--sp-2); flex-shrink: 0; }

/* ---------- Tables (DataTable) ---------- */
.table-wrap { overflow-x: clip; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; }
.tbl.fixed { table-layout: fixed; }
.tbl th { height: var(--row-h); padding: 2px var(--sp-4); text-align: left; font: var(--t-meta); font-weight: var(--fw-medium); letter-spacing: var(--cap-spacing, 0); text-transform: var(--cap-case, none); color: var(--ink-3); background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbl.sticky thead th { position: sticky; top: 0; z-index: var(--z-sticky); }
.tbl td { height: var(--row-h); padding: var(--sp-1) var(--sp-4); border-bottom: 1px solid var(--line); vertical-align: middle; overflow-wrap: anywhere; }
.tbl.dense td { height: var(--row-h-dense); }
.tbl tr.two td { height: var(--row-h-2); }
[data-density="comfortable"] .tbl :is(th, td):first-child { padding-left: var(--sp-6); }
[data-density="comfortable"] .tbl :is(th, td):last-child { padding-right: var(--sp-6); }
.tbl th.n, .tbl td.n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.nowrap { white-space: nowrap; overflow-wrap: normal; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr.click, .tbl tbody tr.has-link { cursor: pointer; }
@media (hover: hover) { .tbl tbody tr.click:hover, .tbl tbody tr.has-link:hover { background: var(--surface-2); } }
.tbl tbody tr[aria-current="true"] { background: var(--primary-soft); }
.tbl tbody tr[aria-current="true"] td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
.tbl tbody tr[aria-selected="true"] { background: color-mix(in srgb, var(--primary) 6%, var(--surface)); }
.tbl .tbl-empty { text-align: center; color: var(--ink-3); padding: var(--section-gap) var(--card-p); }
.tbl .empty-v { color: var(--ink-3); }
.tbl .tbl-open { appearance: none; background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; text-align: inherit; cursor: pointer; }
.tbl .tbl-open:hover, .tbl a.tbl-link:hover { text-decoration: underline; }
.tbl a.tbl-link { color: inherit; text-decoration: none; font-weight: var(--fw-semibold); }
.tbl .tbl-sort { display: inline-flex; align-items: center; gap: var(--sp-1); appearance: none; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.tbl .tbl-sort[data-dir] { color: var(--ink); }
.tbl th.chk, .tbl td.chk { width: 40px; padding-inline: 0; text-align: center; }
.tbl th.chk input, .tbl td.chk input { width: var(--check); height: var(--check); accent-color: var(--primary); margin: 0; }
.tbl tr[aria-level] td:first-child { padding-left: calc(var(--sp-4) + (var(--lvl, 1) - 1) * 24px); }
.tbl-busy tbody { opacity: .6; }
@media (max-width: 760px) { .table-wrap.scroll { overflow-x: auto; } .table-wrap.scroll .tbl { min-width: 560px; } .table-wrap.scroll .tbl :is(th, td):first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; } }

.dt { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
.dt-tools { display: flex; justify-content: flex-end; }
.dt-selall { display: flex; justify-content: center; padding: var(--sp-1h); background: var(--primary-soft); border-radius: var(--r-sm); font: var(--t-meta); }
.dt-cards { list-style: none; display: flex; flex-direction: column; gap: var(--sp-2); }
.tree-b { margin-right: var(--sp-1); vertical-align: middle; }
.fbar { display: flex; flex-direction: column; gap: var(--sp-2); }
.fb-row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); }
.fb-search { flex: 0 1 320px; min-width: 200px; min-height: var(--ctl-h-sm); }

.fbar.narrow .fb-search { flex: 1 1 auto; }
.fb-sort .select { width: auto; }
.frail { width: var(--l-rail); flex-shrink: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
.ftray-g + .ftray-g { padding-top: var(--sp-3); border-top: 1px solid var(--line); }
.bulk { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); min-height: var(--ctl-h); padding: var(--sp-1) var(--sp-3); border-radius: var(--ctl-r); background: var(--primary-soft); }
.keys { display: flex; flex-direction: column; gap: var(--sp-1); margin: 0; }

.ro-i { display: flex; align-items: center; gap: var(--sp-2); min-height: var(--list-h); padding: 0 var(--sp-2); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }

.settings { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: var(--sp-8); align-items: start; }
.set-nav { position: sticky; top: var(--sp-6); display: flex; flex-direction: column; gap: 2px; }
.set-nav a { display: flex; align-items: center; min-height: var(--nav-h); padding: 0 var(--sp-3); border-radius: var(--r-sm); color: var(--ink-2); font: var(--t-label); text-decoration: none; }
.set-nav a[aria-current="true"] { background: var(--primary-soft); color: var(--primary-ink); }
.set-body { display: flex; flex-direction: column; gap: var(--section-gap); min-width: 0; }
.set-row { display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr); gap: var(--sp-6); padding: var(--sp-4) 0; border-bottom: 1px solid var(--line); }
.set-l { display: flex; flex-direction: column; gap: var(--gap-inner); }
@media (max-width: 1199.98px) { .settings, .set-row { grid-template-columns: minmax(0, 1fr); } .set-nav { position: static; flex-direction: row; flex-wrap: wrap; } }

/* ---------- Stat tiles (KPI) ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--gap-grid); }
.kpi { position: relative; display: flex; flex-direction: column; gap: var(--gap-inner); padding: var(--card-p); border: 1px solid var(--line); border-radius: var(--card-r); background: var(--surface); min-width: 0; color: inherit; text-align: left; text-decoration: none; font: inherit; }
.kpi-l { display: flex; align-items: center; gap: var(--sp-1h); font: var(--t-meta); color: var(--ink-3); min-height: 1.5em; padding-right: 28px; }
.kpi-l > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-block: .12em; margin-block: -.12em; }
.kpi-v { display: flex; align-items: baseline; gap: var(--sp-1); min-width: 0; }
.kpi-v b { font: var(--t-figure-l); font-variant-numeric: tabular-nums; color: var(--ink); }
.kpi-u { font: var(--t-meta); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.kpi-f { display: flex; align-items: center; gap: var(--sp-2); min-height: 1.5em; min-width: 0; font: var(--t-meta); color: var(--ink-2); }
.kpi-d { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; font-weight: var(--fw-medium); color: var(--ink-2); }
.kpi-d.good { color: var(--ok-ink); }
.kpi-d.bad { color: var(--warn-ink); }
.kpi-x { position: absolute; top: var(--card-p); right: var(--card-p); color: var(--ink-3); }
a.kpi:hover, button.kpi:hover { border-color: var(--line-strong); }
.kpi[aria-checked="true"], .kpi[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.kpi-spark { display: block; color: var(--primary); }

/* ---------- Desktop (app) shell ---------- */
.shell { display: flex; height: 100%; }
.side { width: var(--sidebar); flex-shrink: 0; height: 100%; display: flex; flex-direction: column; gap: var(--sp-1); padding: var(--sp-3) var(--sp-3) var(--sp-3); background: var(--surface); border-right: 1px solid var(--line); overflow: hidden; }
.side .hide-rail { transition: opacity var(--dur-2) var(--ease-enter); }
@starting-style { .side .hide-rail { opacity: 0; } }
.brand { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) var(--sp-2) var(--sp-3); min-height: var(--topbar-h); }
.brand-name { font: var(--t-title); }
.nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; overflow-x: hidden; min-height: 0; }
.nav-sec { padding: var(--sp-4) var(--sp-3) var(--sp-1); }
.nav a { position: relative; display: flex; align-items: center; gap: var(--sp-3); flex-shrink: 0; min-height: var(--nav-h); padding: 0 var(--sp-3); border-radius: var(--ctl-r); color: var(--ink-2); font: var(--t-label); font-weight: var(--fw-regular); text-decoration: none; white-space: nowrap; transition: background-color var(--dur-1), color var(--dur-1); }
.nav a .lbl { overflow: hidden; text-overflow: ellipsis; padding-block: .12em; margin-block: -.12em; }
@media (hover: hover) { .nav a:hover { background: var(--surface-3); color: var(--ink); } }
.nav a[aria-current="page"] { background: var(--primary-soft); color: var(--primary-ink); font-weight: var(--fw-medium); }
.nav a .nav-rel { margin-left: auto; }
.nav a.rel-dim-nav { color: var(--ink-3); cursor: not-allowed; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--sp-2); }
.me { display: flex; align-items: center; gap: var(--sp-2); min-height: var(--nav-h); padding: var(--sp-1) var(--sp-2); border: 0; border-radius: var(--ctl-r); background: none; text-align: left; white-space: nowrap; }
@media (hover: hover) { .me:hover { background: var(--surface-3); } }
@media (min-width: 761px) {
  .shell.collapsed .side { width: var(--rail); }
  .shell.collapsed .side .hide-rail { display: none; }
  .shell.collapsed .nav a { justify-content: center; padding: 0; }
  .shell.collapsed .brand { justify-content: center; padding-inline: 0; }
  .shell.collapsed .me { justify-content: center; }
}
.side.in-drawer { width: auto; height: auto; min-height: 100%; padding: 0; border: 0; background: transparent; }
.main { flex: 1 1 auto; min-width: 0; height: 100%; display: flex; flex-direction: column; position: relative; }
.topbar { display: flex; align-items: center; gap: var(--sp-2); height: var(--topbar-h); padding: 0 var(--page-px) 0 var(--sp-3); border-bottom: 1px solid var(--line); background: var(--surface); flex-shrink: 0; }
.topbar .tb-name { font: var(--t-label); color: var(--ink-2); }
.content { flex: 1 1 auto; min-height: 0; overflow: auto; }
/* Staff pages start next to the sidebar (left-anchored); data pages are fluid to 1600, form pages to 1200. */
.page { margin: 0; max-width: calc(var(--page-max, var(--l-console-max-data)) + 2 * var(--page-px)); padding: var(--page-pt) var(--page-px) 48px; display: flex; flex-direction: column; gap: var(--section-gap); }
.page[data-page="form"] { --page-max: var(--l-console-max-form); }
.page[data-page="data"] { --page-max: var(--l-console-max-data); }
.page-h { display: flex; align-items: flex-end; gap: var(--sp-3) var(--sp-4); flex-wrap: wrap; }
.page-h .grow { display: flex; flex-direction: column; gap: var(--gap-inner); }
.page-h .ph-title { display: flex; align-items: center; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap; min-width: 0; }
.page-h .ph-title h1 { font: var(--t-headline); }
.page-h .ph-act { display: flex; align-items: center; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap; }
.page-h .ph-sent { font: var(--t-body); color: var(--ink-2); max-width: var(--l-measure); }
.info { display: inline-flex; flex-shrink: 0; }
.info-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink-3); }
.info-btn:hover, .info-btn[aria-expanded="true"] { background: var(--surface-3); color: var(--ink); }
.info-txt p + p { margin-top: var(--sp-2); }
.denied { display: flex; flex-direction: column; }

/* ---------- Overlays (KIT.ui on the UI library) ---------- */
.ov-body { display: flex; flex-direction: column; gap: var(--field-gap); outline: none; }
.ov-foot { display: flex; justify-content: flex-end; align-items: center; gap: var(--sp-3); width: 100%; flex-wrap: wrap; }
.ov-hact, .ov-pager { display: inline-flex; align-items: center; gap: var(--sp-1); }
wa-dialog[data-full]::part(dialog) { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; }
wa-dialog[data-anchor="bottom"]::part(dialog) { width: 100vw; max-width: 100vw; margin: auto 0 0 0; border-radius: var(--dialog-r) var(--dialog-r) 0 0; }
.in-frame::part(dialog) { position: fixed; margin: auto; max-width: none; max-height: none; inset: var(--fy) var(--fr) var(--fb) var(--fx); }
wa-dialog.in-frame::part(dialog) { width: min(calc(var(--fw) - 32px), 560px); height: fit-content; }
wa-dialog.in-frame[data-anchor="bottom"]::part(dialog) { width: var(--fw); margin: auto 0 0 0; border-radius: var(--r-xl) var(--r-xl) 0 0; }
wa-drawer.in-frame::part(dialog) { width: var(--fw); height: fit-content; max-height: calc(var(--fh) * .86); margin: auto 0 0 0; border-radius: var(--r-xl) var(--r-xl) 0 0; }
wa-drawer[placement="bottom"]::part(dialog) { max-height: 86dvh; border-radius: var(--dialog-r) var(--dialog-r) 0 0; }
.spanel { position: sticky; top: var(--sp-6); flex: 0 0 var(--l-panel-m); width: var(--l-panel-m); max-height: calc(100dvh - var(--proto-h) - var(--topbar-h) - 48px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--card-r); animation: kit-in var(--dur-4) var(--ease-enter); }
.spanel.sz-l { flex-basis: var(--l-panel-l); width: var(--l-panel-l); }
.spanel.over { position: absolute; top: 0; right: 0; z-index: var(--z-popover); box-shadow: var(--shadow-3); }
.l-panel { position: relative; }
.spanel-h { display: flex; align-items: center; gap: var(--sp-2); min-height: var(--card-head-h); padding: 0 var(--sp-2) 0 var(--overlay-p); border-bottom: 1px solid var(--line); }
.spanel-h h2 { outline: none; }
.spanel-b { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: var(--overlay-p); display: flex; flex-direction: column; gap: var(--gap-group); }
.spanel-f { display: flex; justify-content: flex-end; gap: var(--sp-3); padding: var(--sp-3) var(--overlay-p); border-top: 1px solid var(--line); background: var(--surface-2); }
wa-popover { --max-width: 400px; }
wa-popover::part(body) { padding: var(--overlay-p); }
.pop { display: flex; flex-direction: column; gap: var(--sp-3); min-width: min(280px, 90vw); font: var(--t-body); color: var(--ink); }
.pop-h { display: flex; align-items: center; gap: var(--sp-2); margin: calc(-1 * var(--sp-2)) calc(-1 * var(--sp-2)) 0 0; }
.pop-b { display: flex; flex-direction: column; gap: var(--field-gap); }
.pop-f { display: flex; justify-content: flex-end; gap: var(--sp-2); }
wa-popover.info-pop { --max-width: 360px; }
.info-txt { font: var(--t-body); color: var(--ink-2); }
.mb-sep { height: 1px; margin: var(--sp-1) 0; background: var(--line); }
.mb-sub { display: block; }
wa-dropdown::part(menu) { min-width: 220px; max-width: 320px; }
wa-toast { --width: min(440px, calc(100vw - 32px)); --gap: var(--sp-2); }
wa-toast[data-place="main"] { inset: auto auto calc(var(--sp-4) + var(--tb, 0px)) calc(var(--tx, 0px) + var(--sp-4)); margin: 0; }
wa-toast[data-place="centre"] { inset: auto 0 calc(var(--sp-4) + var(--tb, 0px)) 0; margin: 0 auto; }
wa-toast[data-place="touch"] { --width: calc(100vw - 24px); inset: auto 12px calc(12px + var(--tb, 0px)) 12px; margin: 0; }
wa-toast[data-place="frame"] { --width: auto; inset: auto calc(var(--tr) + 12px) var(--tb) calc(var(--tx) + 12px); margin: 0; }
.toast-row { display: flex; align-items: center; gap: var(--sp-3); font: var(--t-body); }
.toast-msg { flex: 1 1 auto; min-width: 0; }
.toast-ic { display: grid; place-items: center; flex-shrink: 0; }
.toast-act { margin-inline-start: auto; }
a.lnk { color: var(--primary-ink); text-decoration: underline; text-underline-offset: 3px; }
a.lnk-back, a.lnk-more { text-decoration: none; font: var(--t-label); }
a.lnk-back:hover, a.lnk-more:hover { text-decoration: underline; }
.kit-scope { display: contents; }
.frame-scroll { height: 100%; overflow-y: auto; overflow-x: hidden; }

/* ---------- Legacy overlay classes (0.2; hand-made overlays), removed in 0.4.0. Use KIT.ui overlays. ---------- */
.scrim { position: fixed; inset: 0; z-index: var(--z-modal); background: var(--scrim); display: grid; place-items: center; padding: var(--sp-6); animation: kit-in var(--dur-3) var(--ease-enter); }
.scrim.drawer-host { place-items: stretch end; padding: 0; }
.sheet { width: min(var(--l-panel-m), 100%); height: 100%; display: flex; flex-direction: column; background: var(--surface); box-shadow: var(--shadow-3); }
.sheet-h { display: flex; align-items: center; gap: var(--sp-3); min-height: var(--card-head-h); padding: 0 var(--overlay-p); border-bottom: 1px solid var(--line); }
.sheet-b { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--overlay-p); display: flex; flex-direction: column; gap: var(--field-gap); }
.sheet-f { display: flex; justify-content: flex-end; gap: var(--sp-3); padding: var(--sp-3) var(--overlay-p); border-top: 1px solid var(--line); background: var(--surface-2); }
.menu { position: fixed; z-index: var(--z-popover); max-height: calc(100vh - 80px); overflow: auto; padding: var(--sp-1h); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-3); animation: kit-pop var(--dur-3) var(--ease-enter); }
.menu .mh { display: block; padding: var(--sp-3); }
.menu button { display: flex; align-items: center; gap: var(--sp-2); width: 100%; min-height: var(--menu-item-h); padding: 0 var(--sp-2); border: 0; border-radius: var(--r-sm); background: transparent; text-align: left; color: var(--ink); font: var(--t-body); }
.menu button:hover, .menu button:focus-visible { background: var(--surface-3); outline: none; }
.menu button[aria-current="true"] { background: var(--primary-soft); color: var(--primary-ink); font-weight: var(--fw-medium); }
.menu .code { font: var(--t-code); color: var(--ink-3); min-width: 52px; }
.guide { position: fixed; left: var(--sp-4); bottom: var(--sp-4); z-index: 92; width: min(360px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-3); animation: kit-pop var(--dur-3) var(--ease-enter); }
.guide-h { display: flex; align-items: flex-start; gap: var(--sp-2); }
.guide-ic { width: 32px; height: 32px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-ink); flex-shrink: 0; }
.guide.guide-phone { bottom: 88px; }

/* ---------- Release scope ---------- */
.rel-badge { display: inline-flex; align-items: center; min-height: 20px; padding: 0 var(--sp-1h); border-radius: var(--r-sm); font: var(--t-caption); font-weight: var(--fw-medium); white-space: nowrap; flex-shrink: 0; }
.rb-0 { color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
.rb-1 { background: var(--accent-soft); color: var(--accent-ink); }
.rb-2 { background: var(--primary-soft); color: var(--primary-ink); }
.rb-3 { background: var(--warn-soft); color: var(--warn-ink); }
.rel-inline { display: inline-flex; align-items: center; gap: var(--sp-1h); }
.rel-block { position: relative; }
.rel-flag { position: absolute; top: -9px; right: 16px; z-index: 2; box-shadow: 0 0 0 2px var(--bg); }
.rel-ph { display: flex; align-items: center; justify-content: center; gap: var(--sp-1h); min-height: 44px; padding: var(--sp-3); border: 1px dashed var(--line-strong); border-radius: var(--r-md); background: var(--surface-2); color: var(--ink-3); font: var(--t-meta); }
.rel-strip { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md); border: 1px dashed var(--line-strong); background: var(--surface-2); color: var(--ink-2); font: var(--t-meta); }
.rel-strip.dim { border-style: solid; background: var(--surface); }
.rel-strip b { color: var(--ink); }
.rel-dim { display: flex; flex-direction: column; gap: inherit; opacity: .38; pointer-events: none; filter: saturate(.5); user-select: none; }

/* ---------- Start page ---------- */
.launch { height: 100%; overflow-y: auto; overflow-x: hidden; background: var(--bg); }
.launch-in { max-width: 1200px; margin: 0 auto; padding: var(--sp-12) var(--sp-10); display: flex; flex-direction: column; gap: var(--section-gap); }
.launch-hero { display: flex; flex-direction: column; gap: var(--sp-3); max-width: 860px; }
.lh-brand { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.launch-roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--gap-grid); }
.lr-card { display: flex; flex-direction: column; align-items: stretch; gap: var(--sp-3); padding: var(--card-p); text-align: left; border: 1px solid var(--line); border-radius: var(--card-r); background: var(--surface); color: inherit; min-width: 0; transition: border-color var(--dur-1), box-shadow var(--dur-2); }
@media (hover: hover) { .lr-card:hover { border-color: var(--primary); box-shadow: var(--shadow-2); } }
.lr-card[aria-disabled="true"] { background: var(--surface-2); cursor: not-allowed; }
.lr-card[aria-disabled="true"]:hover { box-shadow: none; border-color: var(--line-strong); }
.lr-ic { width: 40px; height: 40px; border-radius: var(--r-lg); display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-ink); flex-shrink: 0; }
.lr-plat { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
.lr-chip { display: inline-flex; align-items: center; min-height: 24px; padding: 0 var(--sp-2); border-radius: 999px; background: var(--surface-3); font: var(--t-meta); color: var(--ink-2); }
.lr-go { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-1h); padding-top: var(--sp-3); border-top: 1px solid var(--line); font: var(--t-label); color: var(--primary-ink); }
.launch-scen { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--gap-grid); }
.sc-card { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-2); padding: var(--card-p); border-radius: var(--card-r); border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.sc-n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-2); font: var(--t-code); }
.launch-foot { display: flex; align-items: center; gap: var(--sp-2); padding-top: var(--sp-5); border-top: 1px solid var(--line); }

/* ---------- Windows app frame (simulated) ---------- */
.win-desk { height: 100%; display: flex; flex-direction: column; position: relative; background: radial-gradient(120% 90% at 15% 0%, var(--primary-soft), transparent 60%), var(--bg-sunken); }
.win-area { flex: 1 1 auto; min-height: 0; display: flex; }
.win-area.windowed { padding: var(--sp-5) var(--sp-8); }
.win { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.win-area.windowed .win { border: 1px solid var(--line-strong); border-radius: var(--r-md); box-shadow: var(--shadow-3); }
.win-title { height: 36px; flex-shrink: 0; display: flex; align-items: center; gap: var(--sp-2); padding-left: var(--sp-2); background: var(--surface); border-bottom: 1px solid var(--line); font: var(--t-caption); user-select: none; }
.win-name { font-weight: var(--fw-medium); white-space: nowrap; }
.win-btn { width: 46px; height: 36px; flex-shrink: 0; border: 0; background: transparent; color: var(--ink-2); display: grid; place-items: center; }
.win-btn:hover { background: var(--surface-3); color: var(--ink); }
.win-btn.close:hover { background: var(--danger); color: var(--on-danger); }
.win-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.win-body > * { flex: 1 1 auto; min-height: 0; }
.win-empty { flex: 1 1 auto; display: flex; flex-direction: column; align-items: flex-start; padding: var(--sp-6); }
.win-hint { margin: auto; padding: var(--sp-2) var(--sp-4); border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-1); }
.win-shortcut { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1h); width: 104px; padding: var(--sp-2) var(--sp-1h); border: 1px solid transparent; border-radius: var(--r-md); background: transparent; color: var(--ink); font: var(--t-caption); }
