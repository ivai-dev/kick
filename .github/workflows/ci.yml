name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run ruff check .
        working-directory: cli
      - run: uv run pytest -q
        working-directory: cli
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: |
          for example in library-product existing-app; do
            uv run kick --root ../examples/$example check
            uv run kick --root ../examples/$example status
            uv run kick --root ../examples/$example estimate --remaining
          done
        working-directory: cli
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv run pytest -q
        working-directory: cli
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel
        working-directory: cli
      - run: python -c "import glob, zipfile; n = zipfile.ZipFile(glob.glob('cli/dist/*.whl')[0]).namelist(); assert all(f in n for f in ('kick/schemas/project.schema.json', 'kick/schemas/kick.schema.json', 'kick/templates/project/roadmap.md', 'kick/templates/kick/tasks.md')), 'package data missing'"
